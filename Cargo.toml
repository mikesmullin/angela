[package]
name = "angela"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "angela — agentic chat harness. Rust port of /workspace/angela (JS/Bun), built on the agl crate."

[lib]
name = "angela"
path = "src/lib.rs"

[dependencies]
agl = { path = "../agl-rs" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
# Bundled SQLite: the conversation store is a single `.angela/conversations.db`,
# and linking the system libsqlite3 would make the build depend on the host's
# version for JSON1 and WAL, both of which this schema needs.
rusqlite = { version = "0.42", features = ["bundled"] }
# Base64 for attached images: a vision model takes the picture as a data URL
# in the OpenAI content parts, and the bytes on disk must become one.
base64 = "0.22"
sha2 = "0.10"
# For `localtime_r` only: the platform's own idea of local time, including
# the zone abbreviation ("MST"). chrono's `Local` formats `%Z` as a numeric
# offset, which is not what a person reads on a clock.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
